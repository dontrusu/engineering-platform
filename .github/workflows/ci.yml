name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-and-component:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js ## picks up the Node.js version and pnpm version from package.json
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run component tests
        run: pnpm test

  production-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and run browser tests
        run: pnpm test:e2e

      - name: Upload browser-test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    if: ${{ always() }}
    needs: [static-and-component, production-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality-gate job
        env:
          PRODUCTION_BROWSER_RESULT: ${{ needs.production-browser.result }}
          STATIC_AND_COMPONENT_RESULT: ${{ needs.static-and-component.result }}
        run: |
          test "$STATIC_AND_COMPONENT_RESULT" = "success"
          test "$PRODUCTION_BROWSER_RESULT" = "success"
